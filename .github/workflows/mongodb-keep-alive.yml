name: MongoDB Keep Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:            # NUEVO
  contents: read
  actions: write

jobs:
  ping-mongodb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Ping MongoDB
        run: npm run ping-db
        env:
          MONGO_DB_URL: ${{ secrets.MONGO_DB_URL }}

      - name: Mantener vivo el workflow    # NUEVO
        run: |
          WF="${GITHUB_WORKFLOW_REF%@*}"
          WF="${WF##*/}"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$WF/enable"
        env:
          GH_TOKEN: ${{ github.token }}
